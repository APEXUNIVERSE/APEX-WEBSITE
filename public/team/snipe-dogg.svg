<svg xmlns="http://www.w3.org/2000/svg" width="600" height="850" viewBox="0 0 600 850">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2a050b" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#0a0b12" stop-opacity="1"/>
      <stop offset="100%" stop-color="#040407" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cyberRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1f3d"/>
      <stop offset="50%" stop-color="#2a070f"/>
      <stop offset="100%" stop-color="#ff3b5c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="600" height="850" rx="32" fill="url(#bgGlow)"/>
  <rect width="600" height="850" rx="32" fill="url(#grid)"/>

  <!-- Cyber Edge Bevel -->
  <rect x="12" y="12" width="576" height="826" rx="24" fill="none" stroke="url(#cyberRim)" stroke-width="2" opacity="0.85"/>
  <rect x="20" y="20" width="560" height="810" rx="20" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12"/>

  <!-- Top Corner Cyber Accents -->
  <path d="M 12 50 L 12 12 L 50 12" fill="none" stroke="#ff1f3d" stroke-width="4"/>
  <path d="M 588 50 L 588 12 L 550 12" fill="none" stroke="#ff1f3d" stroke-width="4"/>
  <path d="M 12 800 L 12 838 L 50 838" fill="none" stroke="#ff1f3d" stroke-width="4"/>
  <path d="M 588 800 L 588 838 L 550 838" fill="none" stroke="#ff1f3d" stroke-width="4"/>

  <!-- Top Header Bar -->
  <g transform="translate(40, 48)">
    <rect x="0" y="0" width="180" height="34" rx="8" fill="#140306" stroke="#ff1f3d" stroke-width="1.5"/>
    <text x="90" y="22" fill="#ff4d6d" font-family="monospace, sans-serif" font-size="12" font-weight="900" letter-spacing="2" text-anchor="middle">[ALPHA LEADER]</text>

    <rect x="360" y="0" width="160" height="34" rx="8" fill="#140306" stroke="#ff2d4a" stroke-width="1.5"/>
    <text x="440" y="22" fill="#ffffff" font-family="monospace, sans-serif" font-size="13" font-weight="900" letter-spacing="2" text-anchor="middle">FOUNDER</text>
  </g>

  <!-- Center Graphic: Cyber Sniper Reticle & Apex Wolf Silhouette -->
  <g transform="translate(190, 150)">
    <circle cx="110" cy="110" r="105" fill="#120205" stroke="#ff1f3d" stroke-width="2.5" opacity="0.9"/>
    <circle cx="110" cy="110" r="120" fill="none" stroke="#ff1f3d" stroke-dasharray="8 6" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Sniper Crosshair Vector -->
    <circle cx="110" cy="110" r="70" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
    <circle cx="110" cy="110" r="35" fill="none" stroke="#ff3b5c" stroke-width="2"/>
    <circle cx="110" cy="110" r="8" fill="#ff1f3d"/>
    <line x1="110" y1="20" x2="110" y2="200" stroke="#ff3b5c" stroke-width="2.5" opacity="0.8"/>
    <line x1="20" y1="110" x2="200" y2="110" stroke="#ff3b5c" stroke-width="2.5" opacity="0.8"/>
    
    <!-- Wolf Head Emblem Points -->
    <polygon points="110,60 135,100 160,85 145,130 110,165 75,130 60,85 85,100" fill="none" stroke="#ff1f3d" stroke-width="3"/>
  </g>

  <!-- Gamer Tag & Divider -->
  <g transform="translate(300, 450)">
    <text x="0" y="0" fill="#ff4d6d" font-family="monospace, sans-serif" font-size="14" font-weight="bold" letter-spacing="3" text-anchor="middle">// @indiansniper_ //</text>
    <line x1="-220" y1="20" x2="220" y2="20" stroke="#ff1f3d" stroke-width="1.5" stroke-opacity="0.3"/>
    <polygon points="0,15 8,20 0,25 -8,20" fill="#ff1f3d"/>
  </g>

  <!-- Member Name -->
  <g transform="translate(300, 520)">
    <text x="0" y="0" fill="#ffffff" font-family="'Orbitron', sans-serif, monospace" font-size="34" font-weight="900" letter-spacing="4" text-anchor="middle">SNIPE-DOGG</text>
    <text x="0" y="32" fill="#ff1f3d" font-family="monospace, sans-serif" font-size="13" font-weight="bold" letter-spacing="3" text-anchor="middle">FOUNDER &amp; SNIPER SPECIALIST</text>
  </g>

  <!-- Role Specs Box -->
  <g transform="translate(60, 590)">
    <rect x="0" y="0" width="480" height="70" rx="12" fill="#0f0205" stroke="#ff1f3d" stroke-width="1.5" opacity="0.85"/>
    <text x="240" y="28" fill="#ff4d6d" font-family="monospace, sans-serif" font-size="12" font-weight="bold" letter-spacing="2" text-anchor="middle">TACTICAL 3D LOADOUT</text>
    <text x="240" y="52" fill="#ffffff" font-family="'Orbitron', sans-serif, monospace" font-size="16" font-weight="900" letter-spacing="3" text-anchor="middle">⚔ SNIPER RIFLE</text>
  </g>

  <!-- Bottom Stats Grid -->
  <g transform="translate(40, 695)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="150" height="85" rx="12" fill="#0e0e14" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1"/>
    <text x="75" y="30" fill="#ff4d6d" font-family="monospace, sans-serif" font-size="11" font-weight="bold" letter-spacing="1" text-anchor="middle">ROLE</text>
    <text x="75" y="60" fill="#ffffff" font-family="'Orbitron', sans-serif, monospace" font-size="14" font-weight="900" text-anchor="middle">LEADER</text>

    <!-- Stat 2 -->
    <rect x="175" y="0" width="170" height="85" rx="12" fill="#0e0e14" stroke="#ff1f3d" stroke-width="1.5" opacity="0.85"/>
    <text x="260" y="30" fill="#ff4d6d" font-family="monospace, sans-serif" font-size="11" font-weight="bold" letter-spacing="1" text-anchor="middle">ORIGIN</text>
    <text x="260" y="60" fill="#ff3b5c" font-family="'Orbitron', sans-serif, monospace" font-size="14" font-weight="900" text-anchor="middle">EST. 2025</text>

    <!-- Stat 3 -->
    <rect x="370" y="0" width="150" height="85" rx="12" fill="#0e0e14" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1"/>
    <text x="445" y="30" fill="#ff4d6d" font-family="monospace, sans-serif" font-size="11" font-weight="bold" letter-spacing="1" text-anchor="middle">GAMES</text>
    <text x="445" y="60" fill="#ffffff" font-family="'Orbitron', sans-serif, monospace" font-size="12" font-weight="900" text-anchor="middle">WZ / VAL</text>
  </g>

  <!-- Verified Squad Pill -->
  <g transform="translate(60, 805)">
    <circle cx="10" cy="10" r="6" fill="#00ff66"/>
    <text x="28" y="14" fill="#a0a5b5" font-family="monospace, sans-serif" font-size="11" font-weight="bold" letter-spacing="1">VERIFIED CORE ROSTER</text>
    <text x="460" y="14" fill="#606575" font-family="monospace, sans-serif" font-size="11" font-weight="bold" letter-spacing="1" text-anchor="end">APEX UNIVERSE</text>
  </g>
</svg>
